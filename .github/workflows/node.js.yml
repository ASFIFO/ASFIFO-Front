name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Force native bindings
      run: |
        npm install @tailwindcss/oxide-linux-x64-gnu --no-save
        npm rebuild @tailwindcss/vite

    - name: Build frontend
      run: npm run build

    - name: Verify build output
      run: |
        echo "=== Contenu de dist ==="
        ls -la dist/
        echo "=== Nombre de fichiers ==="
        find dist -type f | wc -l

    - name: Upload dist artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Force native bindings
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save
          npm rebuild @tailwindcss/vite

      - name: Build frontend
        run: npm run build

      # ── Prepare deploy folder ─────────────────────────────────
      - name: Prepare files for FTP
        run: |
          mkdir -p deploy
          cp -r dist/. deploy/
          echo "=== Structure finale du dossier deploy ==="
          find deploy -maxdepth 3 -type f | sort

      # ── FTP Deploy ────────────────────────────────────────────
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/asfifo.aimable-mada.com' }}
          exclude: |
            **/.git*
            **/.git*/**
